<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  The fonts of the SVG benchmarks for renderers that find fonts through fontconfig (NetVips: librsvg and Pango).
  Run the benchmarks with FONTCONFIG_FILE set to the full path of this file. It offers only the files that
  SvgBenchmarkFonts lists, so every renderer draws the text of the corpus with the same font files. The reject glob
  matches the files of the directory but not the directory itself, which fontconfig filters with the same globs.
-->
<fontconfig>
  <dir prefix="relative">../../ImageSharp.Drawing.Tests/TestFonts</dir>
  <cachedir prefix="xdg">fontconfig</cachedir>
  <selectfont>
    <rejectfont><glob>*/TestFonts/*</glob></rejectfont>
    <acceptfont><glob>*/OpenSans-Regular.ttf</glob></acceptfont>
  </selectfont>
</fontconfig>

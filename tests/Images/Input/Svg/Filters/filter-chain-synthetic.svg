<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
<defs>
<filter id="paper" x="0" y="0" width="1" height="1">
<feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="4" seed="3" result="noise"/>
<feColorMatrix in="noise" type="matrix" values="0 0 0 0 0.9  0 0 0 0 0.8  0 0 0 0 0.6  0 0 0 -1.2 1.1" result="tint"/>
<feComposite in="tint" in2="SourceGraphic" operator="in" result="grain"/>
<feBlend in="grain" in2="SourceGraphic" mode="multiply"/>
</filter>
<filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
<feMorphology in="SourceAlpha" operator="dilate" radius="4" result="thick"/>
<feFlood flood-color="#ffb000"/>
<feComposite in2="thick" operator="in"/>
<feGaussianBlur stdDeviation="3" result="halo"/>
<feMerge><feMergeNode in="halo"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<filter id="bevel" x="-10%" y="-10%" width="120%" height="120%">
<feGaussianBlur in="SourceAlpha" stdDeviation="4" result="blur"/>
<feSpecularLighting in="blur" surfaceScale="5" specularConstant="0.8" specularExponent="20" lighting-color="#ffffff" result="spec">
<fePointLight x="-5000" y="-10000" z="20000"/>
</feSpecularLighting>
<feComposite in="spec" in2="SourceAlpha" operator="in" result="specIn"/>
<feComposite in="SourceGraphic" in2="specIn" operator="arithmetic" k1="0" k2="1" k3="1" k4="0"/>
</filter>
<filter id="duotone" color-interpolation-filters="sRGB">
<feColorMatrix type="saturate" values="0"/>
<feComponentTransfer>
<feFuncR type="table" tableValues="0.1 0.95"/>
<feFuncG type="table" tableValues="0.15 0.6"/>
<feFuncB type="gamma" amplitude="1" exponent="0.6" offset="0.1"/>
</feComponentTransfer>
</filter>
<filter id="emboss" x="0" y="0" width="1" height="1">
<feConvolveMatrix in="SourceGraphic" order="3" kernelMatrix="-2 -1 0 -1 1 1 0 1 2" preserveAlpha="true" result="relief"/>
<feOffset in="relief" dx="1" dy="1"/>
</filter>
<filter id="ripple" x="-5%" y="-5%" width="110%" height="110%">
<feTurbulence type="turbulence" baseFrequency="0.02 0.05" numOctaves="2" seed="7" result="warp"/>
<feDisplacementMap in="SourceGraphic" in2="warp" scale="18" xChannelSelector="R" yChannelSelector="G"/>
</filter>
<linearGradient id="g1" x2="1" y2="1"><stop offset="0" stop-color="#1f77b4"/><stop offset="1" stop-color="#2ca02c"/></linearGradient>
<linearGradient id="g2" x2="1" y2="1"><stop offset="0" stop-color="#d62728"/><stop offset="1" stop-color="#ff7f0e"/></linearGradient>
</defs>
<rect width="800" height="600" fill="#eceff1"/>
<g transform="translate(25 25)" filter="url(#paper)"><rect width="230" height="250" rx="16" fill="#e8d5b0"/><path d="M30 60 H200 M30 100 H180 M30 140 H200" stroke="#6d4c41" stroke-width="6"/></g>
<g transform="translate(285 25)" filter="url(#glow)"><path d="M115 30 L140 95 L210 100 L155 145 L175 215 L115 175 L55 215 L75 145 L20 100 L90 95 Z" fill="#c62828"/></g>
<g transform="translate(545 25)" filter="url(#bevel)"><rect x="15" y="40" width="200" height="80" rx="40" fill="#3949ab"/><circle cx="115" cy="190" r="45" fill="#00897b"/></g>
<g transform="translate(25 315)" filter="url(#duotone)"><rect width="230" height="250" rx="16" fill="url(#g1)"/><circle cx="80" cy="90" r="45" fill="#ffffff" fill-opacity="0.8"/><path d="M30 220 C80 140 150 260 200 170 L200 230 L30 230 Z" fill="url(#g2)"/></g>
<g transform="translate(285 315)" filter="url(#emboss)"><rect width="230" height="250" rx="16" fill="url(#g1)"/><circle cx="80" cy="90" r="45" fill="#ffffff" fill-opacity="0.8"/><path d="M30 220 C80 140 150 260 200 170 L200 230 L30 230 Z" fill="url(#g2)"/></g>
<g transform="translate(545 315)" filter="url(#ripple)"><rect width="230" height="250" rx="16" fill="url(#g1)"/><circle cx="80" cy="90" r="45" fill="#ffffff" fill-opacity="0.8"/><path d="M30 220 C80 140 150 260 200 170 L200 230 L30 230 Z" fill="url(#g2)"/></g>
</svg>

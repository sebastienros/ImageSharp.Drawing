<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <!-- pathLength scales stroke-dasharray and stroke-dashoffset by the computed length divided by pathLength. -->
  <path d="M 10 10 H 190" stroke="green" stroke-width="6" pathLength="90" stroke-dasharray="10 10"/>
  <path d="M 10 25 H 190" stroke="green" stroke-width="6" pathLength="90" stroke-dasharray="10 10" stroke-dashoffset="5"/>
  <line x1="10" y1="40" x2="190" y2="40" stroke="green" stroke-width="6" pathLength="360" stroke-dasharray="20 20"/>
  <path d="M 10 55 H 100 M 110 55 H 190" stroke="green" stroke-width="6" pathLength="17" stroke-dasharray="2 1"/>
  <path d="M 10 70 H 190" stroke="green" stroke-width="6" pathLength="90" stroke-dasharray="10% 5%" stroke-linecap="round"/>
  <!-- Zero scales by infinity: the first dash covers the path. A negative value is ignored. -->
  <path d="M 10 85 H 190" stroke="green" stroke-width="6" pathLength="0" stroke-dasharray="10 10"/>
  <path d="M 10 100 H 190" stroke="green" stroke-width="6" pathLength="-5" stroke-dasharray="10 10"/>
  <!-- Curves: the dashes start and end at the quarters of the circle and of the cubic. -->
  <circle cx="50" cy="155" r="35" fill="none" stroke="green" stroke-width="6" pathLength="100" stroke-dasharray="25 25"/>
  <rect x="100" y="120" width="80" height="20" fill="none" stroke="navy" stroke-width="4" pathLength="10" stroke-dasharray="1 1"/>
  <path d="M 100 150 C 200 150 100 195 190 195" fill="none" stroke="green" stroke-width="4" pathLength="4" stroke-dasharray="1 1"/>
</svg>

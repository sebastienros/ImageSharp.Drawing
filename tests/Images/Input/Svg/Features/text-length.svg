<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200"
     font-family="Open Sans" font-size="16">
    <path d="M 10 0 V 200 M 190 0 V 200" stroke="#ccc"/>
    <text x="10" y="25" textLength="180">Spacing only</text>
    <text x="10" y="50" textLength="180" lengthAdjust="spacingAndGlyphs" fill="blue">Glyphs too</text>
    <text x="10" y="75" textLength="180" fill="green">Text <tspan fill="red" textLength="70">nested</tspan> end</text>
    <text x="10" y="100">A <tspan textLength="90" fill="purple">short</tspan> run, more</text>
    <text x="190" y="125" text-anchor="end" textLength="120" lengthAdjust="spacingAndGlyphs">Anchored end</text>
    <text x="10" y="150" textLength="50%" font-size="12">Half of the width<tspan x="110" y="150">, a chunk</tspan></text>
    <path id="arc" d="M 20 190 Q 100 140 180 190" fill="none" stroke="#bbb"/>
    <text fill="teal">
        <textPath href="#arc" textLength="160" lengthAdjust="spacingAndGlyphs">Fitted on a path</textPath>
    </text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200"
     font-family="Open Sans" font-size="34">
    <defs>
        <linearGradient id="box">
            <stop offset="0" stop-color="red"/>
            <stop offset="1" stop-color="blue"/>
        </linearGradient>
        <linearGradient id="user" gradientUnits="userSpaceOnUse" x1="0" y1="50" x2="0" y2="90">
            <stop offset="0" stop-color="green"/>
            <stop offset="1" stop-color="yellow"/>
        </linearGradient>
        <pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse">
            <rect width="6" height="6" fill="navy"/>
            <circle cx="3" cy="3" r="2" fill="orange"/>
        </pattern>
    </defs>
    <text x="8" y="40" fill="url(#box)">Gradient</text>
    <text x="8" y="84" fill="url(#user)" stroke="black" stroke-width="1">User</text>
    <text x="110" y="84" fill="url(#dots)">Dot</text>
    <text x="8" y="132" fill="yellow" stroke="black" stroke-width="5" paint-order="stroke">Order</text>
    <text x="8" y="180" fill="black">Op<tspan opacity="0.4" fill="red">ac</tspan><tspan fill="url(#box)" stroke="url(#box)" stroke-width="2">ity</tspan></text>
</svg>

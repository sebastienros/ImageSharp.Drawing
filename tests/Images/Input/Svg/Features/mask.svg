<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="fade"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#000000"/></linearGradient>
    <mask id="luminance"><rect x="5" y="5" width="90" height="90" fill="url(#fade)"/></mask>
    <mask id="alpha" mask-type="alpha">
      <circle cx="150" cy="50" r="40" fill="#000000" fill-opacity="0.5"/>
      <circle cx="150" cy="50" r="20" fill="#000000"/>
    </mask>
    <mask id="region" x="0.25" y="0" width="0.5" height="1" maskContentUnits="objectBoundingBox">
      <rect x="0" y="0" width="1" height="0.5" fill="#ffffff"/>
      <rect x="0" y="0.5" width="1" height="0.5" fill="#808080"/>
    </mask>
    <mask id="linear" color-interpolation="linearRGB"><rect x="100" y="100" width="100" height="100" fill="#808080"/></mask>
  </defs>
  <rect x="0" y="0" width="100" height="100" fill="#1f77b4" mask="url(#luminance)"/>
  <rect x="100" y="0" width="100" height="100" fill="#ff7f0e" mask="url(#alpha)"/>
  <g mask="url(#region)" opacity="0.8">
    <rect x="10" y="110" width="80" height="80" fill="#2ca02c"/>
    <circle cx="50" cy="150" r="25" fill="#9467bd"/>
  </g>
  <rect x="110" y="110" width="80" height="35" fill="#d62728" mask="url(#linear)"/>
  <rect x="110" y="155" width="80" height="35" fill="#d62728" mask="url(#region)"/>
</svg>

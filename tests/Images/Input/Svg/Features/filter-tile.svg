<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <filter id="flood" filterUnits="userSpaceOnUse" x="10" y="10" width="85" height="85">
      <feFlood flood-color="#2e8b57" x="10" y="10" width="12" height="12"/>
      <feOffset dx="6" dy="6"/>
      <feTile/>
    </filter>
    <filter id="graphic" filterUnits="userSpaceOnUse" x="105" y="10" width="85" height="85">
      <feOffset x="105" y="10" width="20" height="16"/>
      <feTile/>
    </filter>
    <filter id="subregion" filterUnits="userSpaceOnUse" x="0" y="100" width="200" height="100">
      <feFlood flood-color="#ff4500" x="10" y="105" width="15" height="10" result="a"/>
      <feFlood flood-color="#4169e1" x="10" y="115" width="15" height="10" result="b"/>
      <feMerge x="10" y="105" width="20" height="20"><feMergeNode in="a"/><feMergeNode in="b"/></feMerge>
      <feTile x="40" y="110" width="150" height="80"/>
    </filter>
  </defs>
  <rect x="20" y="20" width="60" height="60" filter="url(#flood)"/>
  <circle cx="115" cy="18" r="7" fill="#8a2be2" filter="url(#graphic)"/>
  <g filter="url(#subregion)"/>
</svg>

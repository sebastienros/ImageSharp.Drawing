<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <!-- The primitives work along the axes of the user space of the element: under rotation and skew the blur, the
         offset, and the region turn with it. -->
    <filter id="shadow" x="-0.3" y="-0.3" width="1.8" height="1.8">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2 0" result="blur"/>
      <feOffset dx="8" dy="0" result="moved"/>
      <feMerge><feMergeNode in="moved"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="region" x="0" y="0" width="0.6" height="1"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <rect x="20" y="20" width="60" height="40" fill="#1f77b4" filter="url(#shadow)"/>
  <rect x="20" y="20" width="60" height="40" fill="#ff7f0e" filter="url(#shadow)" transform="translate(100 0) rotate(30 50 40)"/>
  <rect x="20" y="20" width="60" height="40" fill="#2ca02c" filter="url(#region)" transform="translate(0 100) skewX(25)"/>
  <rect x="20" y="20" width="60" height="40" fill="#d62728" filter="url(#region)" transform="translate(110 100) scale(-1 1.5) translate(-80 0)"/>
</svg>

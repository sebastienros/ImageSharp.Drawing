<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <clipPath id="circle"><circle cx="50" cy="50" r="40"/></clipPath>
    <clipPath id="union" clip-rule="evenodd">
      <path d="M 150 10 L 180 90 L 110 40 L 190 40 L 120 90 Z"/>
      <rect x="102" y="60" width="14" height="35" clip-rule="nonzero"/>
    </clipPath>
    <clipPath id="box" clipPathUnits="objectBoundingBox" transform="rotate(45)" transform-origin="50 150">
      <rect x="0.25" y="0.25" width="0.5" height="0.5"/>
    </clipPath>
    <clipPath id="inner"><circle cx="150" cy="150" r="38"/></clipPath>
    <clipPath id="nested" clip-path="url(#inner)">
      <rect x="110" y="110" width="80" height="40"/>
      <rect x="110" y="150" width="40" height="40"/>
    </clipPath>
  </defs>
  <rect x="0" y="0" width="100" height="100" fill="#1f77b4" stroke="#000000" stroke-width="8" clip-path="url(#circle)"/>
  <g clip-path="url(#union)" opacity="0.8">
    <rect x="100" y="0" width="100" height="100" fill="#ff7f0e"/>
    <circle cx="150" cy="50" r="20" fill="#9467bd"/>
  </g>
  <rect x="10" y="110" width="80" height="80" fill="#2ca02c" clip-path="url(#box)"/>
  <rect x="100" y="100" width="100" height="100" fill="#d62728" clip-path="url(#nested)"/>
</svg>

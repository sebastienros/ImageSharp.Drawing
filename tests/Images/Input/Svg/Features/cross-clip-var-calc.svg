<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <style>
    svg { --r: 8px; --inset: 4px; --pts: 0 0, 100% 0, 0 100%; --cx: 30%; }
    .a { clip-path: circle(calc(var(--r) + 6px) at var(--cx) 50%); }
    .b { clip-path: inset(var(--inset) round calc(var(--inset) * 2)); }
    .c { clip-path: polygon(var(--pts)); }
    .d { clip-path: ellipse(calc(50% - var(--inset)) min(8px, 40%)); }
    .e { --shape: circle(50%); clip-path: var(--shape) fill-box; }
    .f { --p: 'M 0 0 h 40 l -40 40 z'; clip-path: path(var(--p)); }
    .g { --pd: path('M 5 105 h 40 v 40 z'); d: var(--pd); }
    .h { --p2: 'M 55 105 h 40 l -20 40 z'; d: path(var(--p2)); }
    .i { --k: 2; clip-path: inset(calc(var(--k) * 5%) calc(var(--k) * 1px + 10%)); }
    .j { --b: stroke-box; clip-path: circle(50%) var(--b); }
    .k { clip-path: polygon(evenodd, 0 0, 100% 0, 0 100%, 100% 100%, var(--cx) 0); }
    .l { --t: 10px; clip-path: xywh(var(--t) var(--t) calc(100% - 2 * var(--t)) 50% round var(--t)); }
  </style>
  <rect class="a" x="5" y="5" width="40" height="40" fill="green"/>
  <rect class="b" x="55" y="5" width="40" height="40" fill="green"/>
  <rect class="c" x="105" y="5" width="40" height="40" fill="green"/>
  <rect class="d" x="155" y="5" width="40" height="40" fill="green"/>
  <rect class="e" x="5" y="55" width="40" height="40" fill="green"/>
  <rect class="f" x="55" y="55" width="40" height="40" fill="green"/>
  <rect class="i" x="105" y="55" width="40" height="40" fill="green"/>
  <rect class="j" x="160" y="60" width="30" height="30" fill="green" stroke="navy" stroke-width="10"/>
  <path class="g" d="M0 0" fill="green"/>
  <path class="h" d="M0 0" fill="green"/>
  <rect class="k" x="105" y="105" width="40" height="40" fill="green"/>
  <rect class="l" x="155" y="105" width="40" height="40" fill="green"/>
  <!-- var() in the attribute of clip-path, with calc() inside the shape. -->
  <rect x="5" y="155" width="40" height="40" fill="green" clip-path="var(--s)" style="--s: circle(calc(25% + 5px))"/>
  <rect x="55" y="155" width="40" height="40" fill="green" clip-path="inset(calc(10% + 2px))"/>
  <rect x="105" y="155" width="40" height="40" fill="green" style="--n: 3; clip-path: polygon(50% 0, 100% calc(var(--n) * 30%), 0 100%)"/>
  <rect x="155" y="155" width="40" height="40" fill="green" style="clip-path: circle(max(10px, 30%) at min(30%, 40px) clamp(0px, 70%, 100px))"/>
</svg>

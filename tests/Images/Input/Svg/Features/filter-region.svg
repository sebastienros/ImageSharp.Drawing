<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <!-- The default region (-10%, -10%, 120%, 120% of the bounding box) clips the blur. -->
    <filter id="default"><feGaussianBlur stdDeviation="5"/></filter>
    <!-- A region in bounding box units that cuts into the shape: the blur reads no pixels outside it. -->
    <filter id="box" x="0.2" y="0.1" width="0.6" height="0.8"><feGaussianBlur stdDeviation="3"/></filter>
    <!-- A region in user space. -->
    <filter id="user" filterUnits="userSpaceOnUse" x="110" y="105" width="80" height="50"><feGaussianBlur stdDeviation="4"/></filter>
    <!-- primitiveUnits="objectBoundingBox": the subregion and the standard deviation are fractions of the box. -->
    <filter id="units" primitiveUnits="objectBoundingBox" x="-0.25" y="-0.25" width="1.5" height="1.5">
      <feFlood flood-color="#bcbd22" result="flood"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="0.05" x="-0.1" y="-0.1" width="0.8" height="1.2" result="blur"/>
      <feMerge><feMergeNode in="flood"/><feMergeNode in="blur"/></feMerge>
    </filter>
  </defs>
  <rect x="15" y="15" width="70" height="70" fill="#1f77b4" filter="url(#default)"/>
  <rect x="115" y="15" width="70" height="70" fill="#ff7f0e" filter="url(#box)"/>
  <rect x="25" y="125" width="50" height="50" fill="#2ca02c" filter="url(#units)"/>
  <circle cx="150" cy="150" r="35" fill="#d62728" filter="url(#user)"/>
</svg>

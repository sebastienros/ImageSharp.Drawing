<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <rect x="0" y="0" width="200" height="200" fill="#2ca02c"/>
  <rect x="0" y="0" width="200" height="50" fill="#1f77b4"/>
  <circle cx="25" cy="40" r="20" fill="#ff7f0e" style="mix-blend-mode: multiply"/>
  <circle cx="75" cy="40" r="20" fill="#ff7f0e" style="mix-blend-mode: screen"/>
  <circle cx="125" cy="40" r="20" fill="#ff7f0e" style="mix-blend-mode: difference"/>
  <circle cx="175" cy="40" r="20" fill="#ff7f0e" style="mix-blend-mode: overlay"/>
  <circle cx="25" cy="90" r="20" fill="#ff7f0e" style="mix-blend-mode: color-burn"/>
  <circle cx="75" cy="90" r="20" fill="#ff7f0e" style="mix-blend-mode: exclusion"/>
  <circle cx="125" cy="90" r="20" fill="#ff7f0e" style="mix-blend-mode: hue"/>
  <circle cx="175" cy="90" r="20" fill="#ff7f0e" style="mix-blend-mode: luminosity" opacity="0.5"/>
  <!-- A group with opacity is isolated: its blended child blends with the group content, not with the background. -->
  <g opacity="0.8">
    <rect x="10" y="120" width="80" height="30" fill="#d62728"/>
    <circle cx="50" cy="150" r="25" fill="#ffff00" style="mix-blend-mode: multiply"/>
  </g>
  <!-- isolation: isolate makes the same group isolated without opacity. -->
  <g style="isolation: isolate">
    <circle cx="150" cy="150" r="25" fill="#ffff00" style="mix-blend-mode: multiply"/>
  </g>
  <!-- A group without opacity is not isolated: the child blends with the background. -->
  <g>
    <rect x="110" y="180" width="80" height="15" fill="#ffff00" style="mix-blend-mode: multiply"/>
  </g>
</svg>

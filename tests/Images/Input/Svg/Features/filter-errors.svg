<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <filter id="empty"/>
    <filter id="zero" width="0"><feFlood flood-color="#d62728"/></filter>
    <filter id="box"><feFlood flood-color="#d62728"/></filter>
    <filter id="user" filterUnits="userSpaceOnUse" x="110" y="110" width="80" height="80"><feFlood flood-color="#9467bd"/></filter>
    <filter id="blur"><feGaussianBlur stdDeviation="-3"/></filter>
    <linearGradient id="notfilter"><stop stop-color="#000"/></linearGradient>
  </defs>
  <!-- A reference to a missing element or to an element that is not a filter: the element draws without a filter. -->
  <rect x="10" y="10" width="35" height="35" fill="#1f77b4" filter="url(#missing)"/>
  <rect x="55" y="10" width="35" height="35" fill="#1f77b4" filter="url(#notfilter)"/>
  <!-- A filter without primitives, and a region without area: the element does not draw. -->
  <rect x="110" y="10" width="35" height="35" fill="#d62728" filter="url(#empty)"/>
  <rect x="155" y="10" width="35" height="35" fill="#d62728" filter="url(#zero)"/>
  <!-- An empty group has no bounding box, so a region in bounding box units has no area; in user space it has. -->
  <g filter="url(#box)"/>
  <g filter="url(#user)"/>
  <!-- A negative standard deviation disables the primitive: its result is its input. -->
  <rect x="10" y="110" width="80" height="80" fill="#2ca02c" filter="url(#blur)"/>
</svg>

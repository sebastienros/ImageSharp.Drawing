<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <image id="img" width="16" height="12" xlink:href="data:image/png;base64,"/>
    <mask id="imageMask"><use xlink:href="#img" transform="translate(5 5) scale(5.625 7.5)"/></mask>
    <linearGradient id="fade" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#000000"/></linearGradient>
    <mask id="fadeMask"><rect width="16" height="12" fill="url(#fade)"/></mask>
    <clipPath id="circle"><circle cx="50" cy="150" r="40"/></clipPath>
    <mask id="alphaImage" mask-type="alpha"><use xlink:href="#img" transform="translate(110 110) scale(5 6.667)" opacity="0.5"/></mask>
  </defs>
  <rect width="200" height="200" fill="#ffffff"/>
  <rect x="5" y="5" width="90" height="90" fill="#000000" mask="url(#imageMask)"/>
  <use xlink:href="#img" transform="translate(105 5) scale(5.625 7.5)" mask="url(#fadeMask)"/>
  <g clip-path="url(#circle)">
    <use xlink:href="#img" transform="translate(5 105) scale(7.5)"/>
  </g>
  <rect x="105" y="105" width="90" height="90" fill="#d62728" mask="url(#alphaImage)"/>
</svg>

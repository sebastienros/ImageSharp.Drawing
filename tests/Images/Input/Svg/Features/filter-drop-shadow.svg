<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <filter id="default" filterUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
      <feDropShadow/>
    </filter>
    <filter id="colored" filterUnits="userSpaceOnUse" x="100" y="0" width="100" height="100" color-interpolation-filters="sRGB">
      <feDropShadow dx="6" dy="-4" stdDeviation="3 0" flood-color="#ff0000" flood-opacity="0.6"/>
    </filter>
    <filter id="sharp" filterUnits="userSpaceOnUse" x="0" y="100" width="100" height="100">
      <feDropShadow dx="5" dy="5" stdDeviation="-1" flood-color="#0000ff"/>
    </filter>
    <filter id="bbox" primitiveUnits="objectBoundingBox" x="-0.5" y="-0.5" width="2" height="2">
      <feDropShadow dx="0.1" dy="0.2" stdDeviation="0.05" flood-color="#008000"/>
    </filter>
    <filter id="alpha" filterUnits="userSpaceOnUse" x="0" y="140" width="200" height="60">
      <feDropShadow in="SourceAlpha" dx="0" dy="6" stdDeviation="2" flood-color="#ff00ff"/>
    </filter>
  </defs>
  <circle cx="45" cy="45" r="30" fill="#2e8b57" filter="url(#default)"/>
  <rect x="120" y="20" width="50" height="50" fill="#ffa500" fill-opacity="0.5" stroke="#000000" stroke-width="4" filter="url(#colored)"/>
  <rect x="20" y="110" width="40" height="25" fill="#ffd700" filter="url(#sharp)"/>
  <rect x="120" y="110" width="40" height="25" rx="5" fill="#87ceeb" filter="url(#bbox)"/>
  <path d="M 70 150 L 100 180 L 130 150 Z" fill="#00bfff" filter="url(#alpha)"/>
</svg>

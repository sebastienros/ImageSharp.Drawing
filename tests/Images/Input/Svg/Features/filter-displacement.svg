<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <pattern id="grid" patternUnits="userSpaceOnUse" width="10" height="10">
      <rect width="10" height="10" fill="#ffffff"/>
      <rect width="5" height="10" fill="#1f77b4"/>
      <rect width="10" height="2" fill="#d62728"/>
    </pattern>
    <!-- The map: red from 0 to 1 left to right, green 128 so that the vertical displacement is about 0 in sRGB. -->
    <linearGradient id="ramp" x1="0" x2="1">
      <stop offset="0" stop-color="rgb(0, 128, 0)"/>
      <stop offset="1" stop-color="rgb(255, 128, 0)"/>
    </linearGradient>
    <!-- The common use: turbulence as the map. The map is read in linearRGB, the default; the grid keeps its colors
         (Chromium converts it to linearRGB and back, which darkens the blue a little). Positions outside the filter
         region read transparent black; Chromium reads the source beyond the region there. -->
    <filter id="wobble" filterUnits="userSpaceOnUse" x="5" y="5" width="90" height="90">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="4" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="16" xChannelSelector="R" yChannelSelector="B"/>
    </filter>
    <!-- The group holds the grid and, 50 units lower, the ramp. The map is the ramp moved up over the grid; the grid
         alone is a pass-through offset clipped to its subregion. With red 0.5 in the middle, the left half pulls the
         grid from the left and the right half from the right, up to half the scale. In linearRGB the same map has a
         darker red and green, so the displacement differs. -->
    <filter id="srgb" filterUnits="userSpaceOnUse" x="100" y="0" width="100" height="100" color-interpolation-filters="sRGB">
      <feOffset dy="-50" y="5" height="40" result="map"/>
      <feOffset in="SourceGraphic" y="5" height="40" result="grid"/>
      <feDisplacementMap in="grid" in2="map" scale="20" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="linear" filterUnits="userSpaceOnUse" x="0" y="100" width="100" height="100">
      <feOffset dy="-50" y="105" height="40" result="map"/>
      <feOffset in="SourceGraphic" y="105" height="40" result="grid"/>
      <feDisplacementMap in="grid" in2="map" scale="20" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <!-- The scale in bounding box units is a fraction of the box width on both axes, as Chromium renders it. The map
         is a translucent black flood: alpha 0.8 displaces both axes by 0.3 of the scale. -->
    <filter id="box" filterUnits="userSpaceOnUse" x="100" y="100" width="100" height="100" primitiveUnits="objectBoundingBox">
      <feFlood flood-color="#000000" flood-opacity="0.8" result="map"/>
      <feDisplacementMap in="SourceGraphic" in2="map" scale="0.2"/>
    </filter>
  </defs>
  <rect x="10" y="10" width="80" height="80" fill="url(#grid)" filter="url(#wobble)"/>
  <g filter="url(#srgb)">
    <rect x="110" y="5" width="80" height="40" fill="url(#grid)"/>
    <rect x="110" y="55" width="80" height="40" fill="url(#ramp)"/>
  </g>
  <g filter="url(#linear)">
    <rect x="10" y="105" width="80" height="40" fill="url(#grid)"/>
    <rect x="10" y="155" width="80" height="40" fill="url(#ramp)"/>
  </g>
  <rect x="110" y="110" width="80" height="60" fill="url(#grid)" filter="url(#box)"/>
</svg>

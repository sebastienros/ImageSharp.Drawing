<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1" spreadMethod="reflect">
      <stop offset="0" stop-color="#1f77b4"/>
      <stop offset="1" stop-color="#ffff00"/>
    </linearGradient>
    <linearGradient id="horizontal" href="#base" x2="1" y2="0"/>
    <linearGradient id="short" xlink:href="#horizontal" x2="0.5"/>
    <linearGradient id="ownStops" href="#short">
      <stop offset="0" stop-color="#d62728"/>
      <stop offset="0.7" stop-color="#ffffff"/>
      <stop offset="0.4" stop-color="#2ca02c"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <radialGradient id="radialFromLinear" href="#base" r="0.3"/>
    <linearGradient id="cycleA" href="#cycleB" x2="0.25"><stop offset="0" stop-color="#9467bd"/><stop offset="1" stop-color="#ffffff"/></linearGradient>
    <linearGradient id="cycleB" href="#cycleA" spreadMethod="repeat"/>
    <linearGradient id="userBase" gradientUnits="userSpaceOnUse" x1="10" x2="60">
      <stop offset="0" stop-color="#000000"/>
      <stop offset="1" stop-color="#ff7f0e"/>
    </linearGradient>
    <linearGradient id="userChild" href="#userBase" x1="140" x2="190"/>
  </defs>
  <rect x="10" y="10" width="80" height="50" fill="url(#base)"/>
  <rect x="110" y="10" width="80" height="50" fill="url(#horizontal)"/>
  <rect x="10" y="70" width="80" height="50" fill="url(#short)"/>
  <rect x="110" y="70" width="80" height="50" fill="url(#ownStops)"/>
  <rect x="10" y="130" width="80" height="25" fill="url(#radialFromLinear)"/>
  <rect x="110" y="130" width="80" height="25" fill="url(#cycleB)"/>
  <rect x="10" y="165" width="80" height="25" fill="url(#userBase)"/>
  <rect x="110" y="165" width="80" height="25" fill="url(#userChild)"/>
</svg>

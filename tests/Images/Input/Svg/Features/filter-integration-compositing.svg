<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <filter id="blur" x="-0.5" y="-0.5" width="2" height="2"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="shadow" x="-0.4" y="-0.4" width="1.8" height="1.8" color-interpolation-filters="sRGB">
      <feDropShadow dx="4" dy="4" stdDeviation="2" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <clipPath id="circle"><circle cx="50" cy="50" r="30"/></clipPath>
    <mask id="half"><rect x="0" y="0" width="50" height="100" fill="#ffffff"/><rect x="50" y="0" width="50" height="100" fill="#808080"/></mask>
    <!-- Two children: the clip draws as a coverage layer. -->
    <clipPath id="two"><circle cx="135" cy="50" r="18"/><circle cx="165" cy="50" r="18"/></clipPath>
    <clipPath id="turned" transform="rotate(30 50 150)"><rect x="25" y="135" width="50" height="30"/></clipPath>
    <mask id="skewed" maskUnits="userSpaceOnUse" x="0" y="100" width="200" height="100">
      <rect x="120" y="125" width="50" height="50" fill="#ffffff" transform="skewX(20) translate(-50 0)"/>
    </mask>
  </defs>
  <rect width="200" height="200" fill="#ffffff"/>
  <rect x="0" y="0" width="100" height="100" fill="#ffd27f"/>
  <!-- One element with a filter, a clip, a mask, opacity, and a blend mode: filter first, then clip, mask, opacity, blend. -->
  <rect x="25" y="25" width="50" height="50" fill="#1f77b4" filter="url(#blur)" clip-path="url(#circle)" mask="url(#half)" opacity="0.8" style="mix-blend-mode: multiply"/>
  <!-- A filtered element under a coverage clip of a group. -->
  <g clip-path="url(#two)">
    <rect x="125" y="35" width="50" height="30" fill="#2ca02c" filter="url(#shadow)"/>
  </g>
  <!-- Under a blend group and an opacity group: the shadow reaches beyond the geometry of the group. -->
  <g style="mix-blend-mode: multiply">
    <rect x="115" y="75" width="20" height="15" fill="#d62728" filter="url(#shadow)"/>
  </g>
  <g opacity="0.5">
    <rect x="155" y="75" width="20" height="15" fill="#9467bd" filter="url(#shadow)"/>
  </g>
  <!-- A rotated clip and a skewed mask around filtered content. -->
  <g clip-path="url(#turned)">
    <rect x="20" y="130" width="60" height="40" fill="#8c564b" filter="url(#blur)"/>
  </g>
  <g mask="url(#skewed)">
    <rect x="110" y="120" width="70" height="60" fill="#17becf" filter="url(#shadow)"/>
  </g>
</svg>

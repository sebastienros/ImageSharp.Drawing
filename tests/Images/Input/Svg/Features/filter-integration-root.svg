<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200" filter="url(#root)">
  <defs>
    <filter id="root" filterUnits="userSpaceOnUse" x="0" y="0" width="200" height="200" color-interpolation-filters="sRGB">
      <feColorMatrix type="hueRotate" values="90"/>
    </filter>
    <filter id="inner" x="-0.3" y="-0.3" width="1.6" height="1.6"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <!-- A filter on the root element runs over the whole document, with the filters of its content inside it. -->
  <rect x="20" y="20" width="70" height="70" fill="#d62728"/>
  <rect x="110" y="20" width="70" height="70" fill="#1f77b4" filter="url(#inner)"/>
  <circle cx="100" cy="145" r="40" fill="#2ca02c"/>
</svg>

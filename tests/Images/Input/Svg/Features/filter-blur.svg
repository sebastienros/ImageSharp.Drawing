<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <filter id="small"><feGaussianBlur stdDeviation="0.6"/></filter>
    <filter id="large" x="-0.5" y="-0.5" width="2" height="2"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="even" x="-0.5" y="-0.5" width="2" height="2"><feGaussianBlur stdDeviation="2.4"/></filter>
    <filter id="two" x="-0.5" y="-0.5" width="2" height="2"><feGaussianBlur stdDeviation="8 1"/></filter>
    <filter id="xonly" x="-0.5" y="-0.5" width="2" height="2"><feGaussianBlur stdDeviation="0 6"/></filter>
    <filter id="units" primitiveUnits="objectBoundingBox" x="-0.5" y="-0.5" width="2" height="2">
      <feGaussianBlur stdDeviation="0.1 0.02"/>
    </filter>
  </defs>
  <rect x="15" y="15" width="40" height="40" fill="#1f77b4" filter="url(#small)"/>
  <rect x="80" y="15" width="40" height="40" fill="#ff7f0e" filter="url(#large)"/>
  <circle cx="165" cy="35" r="20" fill="#2ca02c" stroke="#000" stroke-width="3" filter="url(#even)"/>
  <rect x="15" y="110" width="40" height="40" fill="#d62728" filter="url(#two)"/>
  <rect x="80" y="110" width="40" height="40" fill="#9467bd" filter="url(#xonly)"/>
  <rect x="145" y="110" width="40" height="40" fill="#8c564b" filter="url(#units)"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="400" height="200" viewBox="0 0 400 200" font-family="Open Sans">
  <defs>
    <g id="corner"><path d="M 10 10 H 50 V 40" fill="#fc0" stroke="#000" stroke-width="2" vector-effect="non-scaling-stroke"/></g>
    <path id="triangle" d="M 10 10 H 50 V 40 Z" fill="#fc0" stroke="#048" stroke-width="8"/>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#c00"/>
    </marker>
  </defs>
  <!-- Text: non-scaling stroke under a scale, blend modes on text and tspan, paint-order. -->
  <rect x="0" y="0" width="400" height="60" fill="#8cf"/>
  <g transform="scale(3 1)">
    <text x="2" y="44" font-size="36" fill="yellow" stroke="black" stroke-width="2" vector-effect="non-scaling-stroke">VE</text>
  </g>
  <text x="130" y="44" font-size="36" fill="#f80" style="mix-blend-mode: multiply">Mx<tspan fill="#0f0" style="mix-blend-mode: difference">Dy</tspan></text>
  <text x="260" y="44" font-size="36" fill="yellow" stroke="black" stroke-width="5" paint-order="stroke">Po</text>
  <!-- use: non-scaling stroke inside a scaled instance, paint-order and blend modes on the use element. -->
  <rect x="0" y="60" width="400" height="60" fill="#8cf"/>
  <use href="#corner" transform="translate(0 60) scale(2 1)"/>
  <use href="#triangle" x="120" y="60" paint-order="stroke"/>
  <use href="#triangle" x="190" y="60" style="mix-blend-mode: multiply"/>
  <use href="#triangle" x="260" y="60" fill="#0c0" opacity="0.5" style="mix-blend-mode: screen"/>
  <!-- orient="auto-start-reverse": only the first vertex of the path turns, also with several subpaths and when closed. -->
  <path d="M 20 140 L 80 140 M 20 160 L 80 170 M 20 190 L 80 180" fill="none" stroke="#000" stroke-width="2"
        marker-start="url(#arrow)" marker-mid="url(#arrow)" marker-end="url(#arrow)"/>
  <path d="M 120 140 L 180 140 L 150 190 Z" fill="none" stroke="#000" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <path d="M 220 190 C 220 130 300 130 300 190" fill="none" stroke="#000" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
</svg>

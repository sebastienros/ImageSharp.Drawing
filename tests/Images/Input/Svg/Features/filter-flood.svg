<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <filter id="plain"><feFlood flood-color="#1f77b4"/></filter>
    <filter id="opacity"><feFlood flood-color="#ff7f0e" flood-opacity="0.5"/></filter>
    <filter id="current" style="color: #2ca02c"><feFlood style="flood-color: currentColor" color="#9467bd"/></filter>
    <filter id="partial" filterUnits="userSpaceOnUse" x="100" y="100" width="100" height="100">
      <feFlood flood-color="#d62728" x="120" width="40"/>
    </filter>
    <filter id="units" primitiveUnits="objectBoundingBox">
      <feFlood flood-color="#8c564b" x="0.25" y="0.25" width="50%" height="50%"/>
    </filter>
  </defs>
  <rect x="10" y="10" width="80" height="80" fill="red" filter="url(#plain)"/>
  <rect x="110" y="10" width="80" height="80" fill="red" filter="url(#opacity)"/>
  <rect x="10" y="110" width="35" height="80" fill="red" filter="url(#current)"/>
  <rect x="55" y="110" width="35" height="80" fill="red" filter="url(#units)"/>
  <rect x="110" y="110" width="80" height="80" fill="red" filter="url(#partial)"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <!-- A blur of red against blue: linearRGB (the default) keeps the middle brighter than sRGB does. -->
    <filter id="linear" x="0" y="0" width="1" height="1"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="srgb" x="0" y="0" width="1" height="1" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="auto" x="0" y="0" width="1" height="1" color-interpolation-filters="auto"><feGaussianBlur stdDeviation="10"/></filter>
    <!-- The property is read per primitive and inherits from the filter element, not from the filtered element. -->
    <filter id="mixed" x="0" y="0" width="1" height="1" color-interpolation-filters="sRGB">
      <feFlood flood-color="#00ff00" flood-opacity="0.5" result="green"/>
      <feComposite in="green" in2="SourceGraphic" operator="arithmetic" k2="1" k3="1" color-interpolation-filters="linearRGB"/>
    </filter>
    <linearGradient id="bands">
      <stop offset="0.5" stop-color="#ff0000"/>
      <stop offset="0.5" stop-color="#0000ff"/>
    </linearGradient>
  </defs>
  <g color-interpolation-filters="sRGB">
    <rect x="10" y="10" width="180" height="40" fill="url(#bands)" filter="url(#linear)"/>
  </g>
  <rect x="10" y="55" width="180" height="40" fill="url(#bands)" filter="url(#srgb)"/>
  <rect x="10" y="100" width="180" height="40" fill="url(#bands)" filter="url(#auto)"/>
  <rect x="10" y="145" width="180" height="45" fill="url(#bands)" filter="url(#mixed)"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <!-- Erode and dilate take the minimum and the maximum per premultiplied channel over a rectangle of radius rx, ry. -->
    <filter id="erode" filterUnits="userSpaceOnUse" x="0" y="0" width="100" height="100"><feMorphology radius="4"/></filter>
    <filter id="dilate" filterUnits="userSpaceOnUse" x="100" y="0" width="100" height="100"><feMorphology operator="dilate" radius="6 2"/></filter>
    <!-- Zero on one axis works on the other axis only; a fraction rounds to whole filter pixels (1.5 to 2 at scale 1). -->
    <filter id="axis" filterUnits="userSpaceOnUse" x="0" y="100" width="100" height="100"><feMorphology operator="dilate" radius="0 8"/></filter>
    <!-- A dilated outline from SourceAlpha under the source, and a radius in bounding box units (0.05 of the box). -->
    <filter id="outline" filterUnits="userSpaceOnUse" x="100" y="100" width="100" height="100" primitiveUnits="objectBoundingBox">
      <feMorphology in="SourceAlpha" operator="dilate" radius="0.05" result="thick"/>
      <feFlood flood-color="#9467bd"/>
      <feComposite in2="thick" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="fade">
      <stop offset="0" stop-color="#1f77b4"/>
      <stop offset="1" stop-color="#ff7f0e" stop-opacity="0.3"/>
    </linearGradient>
  </defs>
  <g filter="url(#erode)">
    <rect x="10" y="10" width="80" height="35" fill="url(#fade)"/>
    <circle cx="30" cy="70" r="20" fill="#2ca02c"/>
    <path d="M60 55 L90 90 M60 90 L90 55" stroke="#d62728" stroke-width="9"/>
  </g>
  <g filter="url(#dilate)">
    <rect x="115" y="15" width="25" height="25" fill="#1f77b4" fill-opacity="0.6"/>
    <rect x="130" y="30" width="25" height="25" fill="#ff7f0e" fill-opacity="0.6"/>
    <circle cx="170" cy="75" r="1.5" fill="#d62728"/>
    <path d="M110 85 H190" stroke="#2ca02c" stroke-width="1"/>
  </g>
  <g filter="url(#axis)">
    <path d="M15 150 H85 M15 130 H85" stroke="#8c564b" stroke-width="2"/>
    <circle cx="50" cy="175" r="6" fill="#e377c2"/>
  </g>
  <path d="M120 120 L180 120 L150 180 Z" fill="#17becf" filter="url(#outline)"/>
</svg>

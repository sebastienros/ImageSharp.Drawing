<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="spectrum">
      <stop offset="0" stop-color="#ff0000"/>
      <stop offset="0.5" stop-color="#00ff00"/>
      <stop offset="1" stop-color="#0000ff"/>
    </linearGradient>
    <filter id="offset" x="-0.5" y="-0.5" width="1.5" height="2">
      <feOffset dx="0" dy="4"/>
    </filter>
    <style>
      .styled { filter: sepia(70%) saturate(3) hue-rotate(90deg); }
    </style>
  </defs>
  <rect x="5" y="5" width="40" height="25" fill="url(#spectrum)" filter="grayscale(1)"/>
  <rect x="55" y="5" width="40" height="25" fill="url(#spectrum)" filter="sepia(0.8)"/>
  <rect x="105" y="5" width="40" height="25" fill="url(#spectrum)" filter="saturate(0.3)"/>
  <rect x="155" y="5" width="40" height="25" fill="url(#spectrum)" filter="hue-rotate(0.5turn)"/>
  <rect x="5" y="40" width="40" height="25" fill="url(#spectrum)" filter="invert(0.8)"/>
  <rect x="55" y="40" width="40" height="25" fill="url(#spectrum)" filter="brightness(1.6)"/>
  <rect x="105" y="40" width="40" height="25" fill="url(#spectrum)" filter="contrast(0.4)"/>
  <rect x="155" y="40" width="40" height="25" fill="url(#spectrum)" filter="opacity(40%)"/>
  <rect x="5" y="75" width="40" height="25" fill="url(#spectrum)" class="styled"/>
  <rect x="55" y="75" width="40" height="25" fill="url(#spectrum)" filter="blur(2px) grayscale(1)"/>
  <rect x="105" y="78" width="40" height="20" fill="none" stroke="#4682b4" stroke-width="6" filter="drop-shadow(#000000 4px 4px 2px)"/>
  <rect x="155" y="75" width="40" height="25" fill="#ffa500" filter="drop-shadow(#ff0000 3px 3px 0) drop-shadow(#0000ff -3px -3px 0)"/>
  <circle cx="40" cy="145" r="25" fill="#2e8b57" filter="drop-shadow(#000080 0 0 12px)"/>
  <rect x="80" y="120" width="40" height="40" fill="#9370db" filter="url(#offset) drop-shadow(#000000 5px 0 1px)"/>
  <rect x="140" y="120" width="40" height="40" fill="#20b2aa" filter="blur(3px) url(#offset) opacity(0.7)"/>
  <rect x="80" y="172" width="100" height="20" fill="url(#spectrum)" filter="invert() brightness(0.5) contrast(2)"/>
</svg>

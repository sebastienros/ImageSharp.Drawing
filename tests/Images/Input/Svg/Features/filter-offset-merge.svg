<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <filter id="offset" x="-0.5" y="-0.5" width="2" height="2"><feOffset dx="12" dy="8"/></filter>
    <filter id="fraction" x="-0.5" y="-0.5" width="2" height="2"><feOffset dx="-6.5" dy="10.25"/></filter>
    <filter id="units" primitiveUnits="objectBoundingBox" x="-0.5" y="-0.5" width="2" height="2">
      <feOffset dx="0.25" dy="-0.25"/>
    </filter>
    <filter id="merge" x="-0.2" y="-0.2" width="1.5" height="1.5">
      <feFlood flood-color="#ff7f0e" flood-opacity="0.6" result="flood"/>
      <feOffset in="SourceAlpha" dx="10" dy="10" result="shadow"/>
      <feMerge>
        <feMergeNode in="flood"/>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <circle cx="45" cy="45" r="25" fill="#1f77b4" filter="url(#offset)"/>
  <circle cx="150" cy="45" r="25" fill="#2ca02c" fill-opacity="0.8" filter="url(#fraction)"/>
  <rect x="25" y="125" width="40" height="40" fill="#9467bd" filter="url(#units)"/>
  <rect x="115" y="115" width="50" height="50" fill="#d62728" filter="url(#merge)"/>
</svg>

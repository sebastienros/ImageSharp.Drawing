<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500" viewBox="0 0 400 500">
  <defs>
    <mask id="half"><rect width="100" height="60" fill="white"/></mask>
    <filter id="shift"><feOffset dx="5" dy="0"/></filter>
    <clipPath id="child-shape"><rect x="20" y="20" width="60" height="60" style="clip-path: circle()"/></clipPath>
    <clipPath id="self-shape" style="clip-path: circle(closest-side)"><rect width="100" height="100"/></clipPath>
  </defs>
  <!-- Row 1: reference boxes and inset() with rounded corners. -->
  <svg x="0" y="0" width="100" height="100" overflow="visible">
    <rect x="20" y="20" width="60" height="60" fill="green" stroke="blue" stroke-opacity="0.5" stroke-width="20" style="clip-path: circle()"/>
  </svg>
  <svg x="100" y="0" width="100" height="100" overflow="visible">
    <rect x="20" y="20" width="60" height="60" fill="green" stroke="blue" stroke-opacity="0.5" stroke-width="20" style="clip-path: circle() fill-box"/>
  </svg>
  <svg x="200" y="0" width="100" height="100" overflow="visible">
    <rect x="20" y="20" width="60" height="60" fill="green" style="clip-path: inset(10% 20% round 10px)"/>
  </svg>
  <svg x="300" y="0" width="100" height="100" overflow="visible">
    <rect x="20" y="20" width="60" height="60" fill="green" style="clip-path: inset(0 round 50px 10px)"/>
  </svg>
  <!-- Row 2: circle() and ellipse() radii and positions, polygon() fill rules. -->
  <svg x="0" y="100" width="100" height="100" overflow="visible">
    <rect x="20" y="20" width="60" height="60" fill="green" style="clip-path: ellipse(closest-side farthest-side at 30% 40%)"/>
  </svg>
  <svg x="100" y="100" width="100" height="100" overflow="visible">
    <rect x="20" y="20" width="60" height="60" fill="green" style="clip-path: circle(15px at right 10px top 20%)"/>
  </svg>
  <svg x="200" y="100" width="100" height="100" overflow="visible">
    <rect x="20" y="20" width="60" height="60" fill="green" style="clip-path: polygon(evenodd, 50% 0, 79% 90%, 2% 35%, 98% 35%, 21% 90%)"/>
  </svg>
  <svg x="300" y="100" width="100" height="100" overflow="visible">
    <rect x="20" y="20" width="60" height="60" fill="green" style="clip-path: polygon(50% 0, 79% 90%, 2% 35%, 98% 35%, 21% 90%)"/>
  </svg>
  <!-- Row 3: path() on the stroke box, xywh(), rect(), and a transformed group. -->
  <svg x="0" y="200" width="100" height="100" overflow="visible">
    <rect x="20" y="20" width="60" height="60" fill="green" stroke="blue" stroke-opacity="0.5" stroke-width="20" style="clip-path: path(evenodd, 'M 30 0 L 47 54 L 1 21 L 59 21 L 13 54 Z') stroke-box"/>
  </svg>
  <svg x="100" y="200" width="100" height="100" overflow="visible">
    <rect x="20" y="20" width="60" height="60" fill="green" style="clip-path: xywh(10px 10px 30px 40px round 5px)"/>
  </svg>
  <svg x="200" y="200" width="100" height="100" overflow="visible">
    <rect x="20" y="20" width="60" height="60" fill="green" style="clip-path: rect(10px 50px 40px 5px)"/>
  </svg>
  <svg x="300" y="200" width="100" height="100" overflow="visible">
    <g transform="translate(10 0) scale(0.8)" style="clip-path: circle()">
      <rect x="20" y="20" width="40" height="40" fill="green"/>
      <rect x="40" y="40" width="40" height="40" fill="navy"/>
    </g>
  </svg>
  <!-- Row 4: transform, filter and mask, clipPath children and the clipPath element, view-box. -->
  <svg x="0" y="300" width="100" height="100" overflow="visible">
    <rect x="20" y="20" width="60" height="60" fill="green" transform="rotate(30 50 50)" style="clip-path: inset(0 0 50% 0)"/>
  </svg>
  <svg x="100" y="300" width="100" height="100" overflow="visible">
    <rect x="20" y="20" width="60" height="60" fill="green" style="clip-path: circle()" mask="url(#half)" filter="url(#shift)"/>
  </svg>
  <svg x="200" y="300" width="100" height="100" overflow="visible">
    <rect width="100" height="100" fill="green" clip-path="url(#child-shape)"/>
    <rect x="40" y="40" width="20" height="20" fill="navy" clip-path="url(#self-shape)"/>
  </svg>
  <svg x="300" y="300" width="100" height="100" viewBox="50 50 200 200" overflow="visible">
    <rect x="50" y="50" width="200" height="200" fill="green" style="clip-path: circle(50px) view-box"/>
  </svg>
  <!-- Row 5: lines (stroke box and empty fill box), opacity with blending, a presentation attribute. -->
  <svg x="0" y="400" width="100" height="100" overflow="visible">
    <line x1="10" y1="50" x2="90" y2="50" stroke="green" stroke-width="20" style="clip-path: inset(5px)"/>
    <line x1="10" y1="80" x2="90" y2="80" stroke="red" stroke-width="10" style="clip-path: inset(0) fill-box"/>
  </svg>
  <svg x="100" y="400" width="100" height="100" overflow="visible">
    <rect x="0" y="0" width="100" height="100" fill="#fc0"/>
    <g opacity="0.5" style="clip-path: polygon(evenodd, 50% 0, 79% 90%, 2% 35%, 98% 35%, 21% 90%); mix-blend-mode: multiply">
      <rect x="20" y="20" width="60" height="60" fill="blue"/>
    </g>
  </svg>
  <svg x="200" y="400" width="100" height="100" overflow="visible">
    <path d="M 35 95 L 50 25 L 65 95 Z" fill="green" stroke="blue" stroke-opacity="0.5" stroke-width="6" stroke-miterlimit="10" style="clip-path: polygon(0 0, 100% 0, 50% 100%) stroke-box"/>
  </svg>
  <svg x="300" y="400" width="100" height="100" overflow="visible">
    <rect x="20" y="20" width="60" height="60" fill="green" clip-path="circle(20px)"/>
  </svg>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <pattern id="checker" patternUnits="userSpaceOnUse" width="10" height="10">
      <rect width="10" height="10" fill="#1f77b4"/>
      <rect width="5" height="5" fill="#ff7f0e"/>
      <rect x="5" y="5" width="5" height="5" fill="#ff7f0e"/>
    </pattern>
    <pattern id="stripes" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#000000"/>
      <rect width="4" height="8" fill="#ffffff"/>
    </pattern>
    <pattern id="box" width="0.25" height="0.25">
      <circle cx="10" cy="10" r="8" fill="#2ca02c"/>
    </pattern>
    <linearGradient id="fade"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#000000"/></linearGradient>
    <mask id="fadeMask"><rect width="100" height="100" fill="url(#fade)"/></mask>
    <mask id="stripeMask"><rect x="105" y="5" width="90" height="90" fill="url(#stripes)"/></mask>
    <mask id="circleMask" maskContentUnits="objectBoundingBox"><circle cx="0.5" cy="0.5" r="0.5" fill="#ffffff"/></mask>
    <mask id="tileMask"><rect width="20" height="10" fill="#ffffff"/></mask>
    <pattern id="maskedTile" patternUnits="userSpaceOnUse" width="20" height="20">
      <rect width="20" height="20" fill="#9467bd" mask="url(#tileMask)"/>
    </pattern>
  </defs>
  <rect width="200" height="200" fill="#ffffff"/>
  <g mask="url(#fadeMask)">
    <rect x="5" y="5" width="90" height="60" fill="url(#checker)"/>
    <circle cx="50" cy="70" r="25" fill="url(#checker)" stroke="#000000" stroke-width="2"/>
  </g>
  <rect x="105" y="5" width="90" height="90" fill="#d62728" mask="url(#stripeMask)"/>
  <g mask="url(#circleMask)" opacity="0.7">
    <rect x="5" y="105" width="80" height="80" fill="url(#box)"/>
    <rect x="45" y="145" width="50" height="50" fill="#8c564b"/>
  </g>
  <rect x="105" y="105" width="90" height="90" fill="url(#maskedTile)" stroke="#000000"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <pattern id="blended" patternUnits="userSpaceOnUse" width="30" height="30">
      <rect width="20" height="20" fill="#ffff00"/>
      <circle cx="18" cy="18" r="10" fill="#00bfff" style="mix-blend-mode: multiply"/>
    </pattern>
    <pattern id="isolated" patternUnits="userSpaceOnUse" width="30" height="30">
      <rect width="30" height="30" fill="#ffffff"/>
      <g style="isolation: isolate" opacity="0.6">
        <rect x="2" y="2" width="18" height="18" fill="#2ca02c"/>
        <rect x="10" y="10" width="18" height="18" fill="#d62728" style="mix-blend-mode: screen"/>
      </g>
    </pattern>
    <clipPath id="tileClip"><circle cx="10" cy="10" r="9"/></clipPath>
    <pattern id="clipped" patternUnits="userSpaceOnUse" width="20" height="20">
      <rect width="20" height="20" fill="#9467bd" clip-path="url(#tileClip)"/>
    </pattern>
    <clipPath id="bboxClip" clipPathUnits="objectBoundingBox"><rect width="0.5" height="1"/></clipPath>
    <pattern id="clippedBox" patternUnits="userSpaceOnUse" width="25" height="25" patternTransform="rotate(20)">
      <rect x="2" y="2" width="20" height="20" fill="#8c564b" clip-path="url(#bboxClip)"/>
      <rect x="2" y="2" width="20" height="20" fill="none" stroke="#000000"/>
    </pattern>
  </defs>
  <rect width="200" height="200" fill="#e0e0e0"/>
  <rect x="5" y="5" width="90" height="90" fill="url(#blended)"/>
  <rect x="105" y="5" width="90" height="90" fill="url(#isolated)"/>
  <circle cx="50" cy="150" r="40" fill="url(#clipped)" stroke="url(#blended)" stroke-width="6"/>
  <rect x="105" y="105" width="90" height="90" fill="url(#clippedBox)" style="mix-blend-mode: multiply"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <!-- The subregion clips the result of the blur, not its input. -->
    <filter id="clip" filterUnits="userSpaceOnUse" x="0" y="0" width="200" height="100">
      <feGaussianBlur stdDeviation="4" x="20" y="20" width="50" height="60"/>
    </filter>
    <!-- Defaults: the offset takes the subregion of its input, the merge the union of its inputs. -->
    <filter id="union" filterUnits="userSpaceOnUse" x="100" y="0" width="100" height="100">
      <feFlood flood-color="#9467bd" x="110" y="10" width="30" height="30" result="a"/>
      <feOffset in="a" dx="20" dy="20" result="b"/>
      <feFlood flood-color="#8c564b" flood-opacity="0.5" x="150" y="50" width="40" height="40" result="c"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="c"/></feMerge>
    </filter>
    <!-- A zero width disables a primitive: its result is transparent. -->
    <filter id="zero" filterUnits="userSpaceOnUse" x="0" y="100" width="100" height="100">
      <feFlood flood-color="#d62728" width="0" result="none"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="none"/></feMerge>
    </filter>
    <!-- A partial subregion: only x and width are given, y and height come from the filter region. -->
    <filter id="partial" filterUnits="userSpaceOnUse" x="100" y="110" width="100" height="80">
      <feFlood flood-color="#17becf" x="130" width="40"/>
    </filter>
  </defs>
  <rect x="10" y="10" width="80" height="80" fill="#1f77b4" filter="url(#clip)"/>
  <rect x="100" y="0" width="1" height="1" fill="none" filter="url(#union)"/>
  <rect x="20" y="120" width="60" height="60" fill="#2ca02c" filter="url(#zero)"/>
  <rect x="110" y="120" width="80" height="60" fill="#ff7f0e" filter="url(#partial)"/>
</svg>

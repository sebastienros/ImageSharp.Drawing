<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <!-- SVG 2 geometry properties from CSS: a declaration wins over the attribute. Green passes; red shows a failure. -->
  <style>
    #sheet { x: 105px; width: 20px; }
    #image { x: 155px; width: 20px; height: 20px; }
  </style>
  <defs>
    <rect id="u" width="20" height="20" fill="green"/>
    <symbol id="s" viewBox="0 0 10 10" preserveAspectRatio="none"><rect width="10" height="10" fill="green"/></symbol>
  </defs>

  <!-- Row 1: rect x, y, width, height, rx from CSS; a percentage; a style sheet rule; width: auto draws nothing. -->
  <rect x="100" y="5" width="20" height="20" fill="green" style="x: 5px"/>
  <rect x="30" y="100" width="20" height="20" fill="green" style="y: 5px"/>
  <rect x="55" y="5" width="1" height="1" fill="green" style="width: 20px; height: 20px"/>
  <rect x="0" y="5" width="20" height="20" fill="green" style="x: 40%"/>
  <rect id="sheet" x="0" y="5" width="1" height="20" fill="green"/>
  <rect x="130" y="5" width="20" height="20" fill="red" style="width: auto"/>
  <rect x="130" y="5" width="20" height="20" fill="green" style="rx: 5px"/>
  <rect x="155" y="5" width="20" height="20" fill="red" style="width: initial"/>
  <rect x="155" y="5" width="20" height="20" fill="green" rx="0" style="rx: auto; ry: 10px"/>

  <!-- Row 2: circle and ellipse geometry, r as a percentage of the viewport diagonal, rx: auto. -->
  <circle cx="0" cy="0" r="1" fill="green" style="cx: 15px; cy: 40px; r: 10px"/>
  <circle cx="40" cy="40" r="1" fill="green" style="r: 5%"/>
  <ellipse cx="65" cy="40" rx="1" ry="1" fill="green" style="rx: 10px; ry: 5px"/>
  <ellipse cx="90" cy="40" rx="1" ry="1" fill="green" style="rx: auto; ry: 10px"/>
  <!-- A negative radius is invalid: the attribute stays. -->
  <circle cx="115" cy="40" r="10" fill="green" style="r: -5px"/>
  <!-- Unitless numbers are user units. -->
  <rect x="0" y="30" width="20" height="20" fill="green" style="x: 130"/>
  <!-- em lengths use the font size of the element. -->
  <rect x="155" y="30" width="1" height="20" fill="green" font-size="10" style="width: 2em"/>

  <!-- Row 3: d with path() and none; path() with a fill rule is invalid for d, so the attribute stays. -->
  <path fill="green" d="M0 0" style="d: path('M 5 55 h 20 v 20 h -20 z')"/>
  <path fill="red" d="M 30 55 h 20 v 20 h -20 z" style="d: none"/>
  <path fill="green" d="M 55 55 h 20 v 20 h -20 z" style="d: path(evenodd, 'M 0 0 h 1')"/>
  <path fill="green" d="M 80 55 h 20 v 20 h -20 z" style="d: path('M 0 0 Z bad')"/>

  <!-- Row 4: use takes x and y from CSS, but not width and height; image takes all four. -->
  <use href="#u" x="100" y="100" style="x: 5px; y: 80px"/>
  <use href="#s" x="30" y="80" width="20" height="20" style="width: 100px"/>
  <image id="image" x="0" y="80" width="100" height="5" preserveAspectRatio="none"
         href="data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='10'%3E%3Crect width='10' height='10' fill='green'/%3E%3C/svg%3E"/>
  <!-- A nested svg ignores CSS x and width, as in Chromium. -->
  <svg x="55" y="80" width="20" height="20" style="x: 120px; width: 100px"><rect width="100" height="20" fill="green"/></svg>
  <!-- inherit takes the x attribute of the parent svg. -->
  <svg x="40" y="80" width="40" height="20" overflow="visible"><rect x="0" y="0" width="20" height="20" fill="green" style="x: inherit"/></svg>

  <!-- Row 5: math functions mixing a percentage with a length resolve against the viewport. -->
  <rect x="0" y="105" width="1" height="20" fill="green" style="x: calc(2.5% + 0px); width: calc(10% - 0.5em)" font-size="0"/>
  <rect x="calc(15% + 0px)" y="105" width="calc(10% - 0px)" height="20" fill="green"/>
  <rect x="55" y="105" width="min(10%, 100px)" height="20" fill="green"/>
  <rect x="80" y="105" width="clamp(1px, 10%, 100px)" height="20" fill="green"/>
</svg>

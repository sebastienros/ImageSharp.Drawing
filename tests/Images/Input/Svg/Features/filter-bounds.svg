<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <filter id="blur" x="-1" y="-1" width="3" height="3"><feGaussianBlur stdDeviation="8"/></filter>
    <mask id="mask"><rect x="100" y="0" width="100" height="200" fill="#fff"/></mask>
  </defs>
  <!-- Layers are bounded by their content; a filtered child paints its filter region, far beyond its geometry. -->
  <g opacity="0.6">
    <rect x="40" y="40" width="20" height="20" fill="#1f77b4" filter="url(#blur)"/>
    <rect x="45" y="45" width="10" height="10" fill="#ff7f0e"/>
  </g>
  <g mask="url(#mask)">
    <rect x="140" y="40" width="20" height="20" fill="#2ca02c" filter="url(#blur)"/>
  </g>
  <g opacity="0.5">
    <circle cx="50" cy="150" r="10" fill="#d62728" filter="url(#blur)"/>
  </g>
  <g style="isolation: isolate" opacity="0.8">
    <circle cx="150" cy="150" r="10" fill="#9467bd" filter="url(#blur)"/>
    <circle cx="150" cy="150" r="5" fill="#8c564b" style="mix-blend-mode: multiply"/>
  </g>
</svg>
